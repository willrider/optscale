{{- $tls := .Values.ingress.tls }}
{{- if and .Values.ingress.enabled $tls.enabled $tls.crt $tls.key (not $tls.certManager.enabled) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tls.secretName }}
  labels:
    {{- include "optscale.labels" (dict "root" . "name" "optscale") | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $tls.crt | b64enc | quote }}
  tls.key: {{ $tls.key | b64enc | quote }}
{{- end }}
