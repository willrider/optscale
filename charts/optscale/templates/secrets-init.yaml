{{- if .Values.secretsInit.enabled }}
{{- $v := .Values }}
{{- $alnum24 := dict "generate" "alnum" "length" 24 }}
{{- $alnum40 := dict "generate" "alnum" "length" 40 }}
{{- $fernet := dict "generate" "fernet" }}
{{- $specs := list }}
{{- if not $v.mariadb.existingSecret }}
{{- $specs = append $specs (dict "name" "mariadb-secret" "data" (dict "password" $alnum24)) }}
{{- end }}
{{- if not $v.mongo.existingSecret }}
{{- if $v.mongo.external.enabled }}
{{- fail "mongo.external.enabled requires mongo.existingSecret (a Secret with key `url`)" }}
{{- end }}
{{- $specs = append $specs (dict "name" "mongo-secret" "data" (dict "username" (dict "value" $v.mongo.user) "password" $alnum24 "key.txt" $alnum40)) }}
{{- end }}
{{- if not $v.clickhouse.existingSecret }}
{{- if $v.clickhouse.external.enabled }}
{{- fail "clickhouse.external.enabled requires clickhouse.existingSecret (a Secret with key `password`)" }}
{{- end }}
{{- $specs = append $specs (dict "name" "clickhouse-secret" "data" (dict "password" $alnum24)) }}
{{- end }}
{{- if not $v.rabbitmq.existingSecret }}
{{- $specs = append $specs (dict "name" "rabbit-secret" "data" (dict "username" (dict "value" $v.rabbitmq.user) "password" $alnum24 "erlang-cookie" $alnum40)) }}
{{- end }}
{{- if not $v.minio.existingSecret }}
{{- $specs = append $specs (dict "name" "minio-secret" "data" (dict "access" (dict "value" $v.minio.accessKey) "secret" $alnum24)) }}
{{- end }}
{{- if not $v.config.secrets.existingSecret }}
{{- $specs = append $specs (dict "name" "cluster-secret" "data" (dict "cluster_secret" $alnum40)) }}
{{- end }}
{{- if not $v.config.existingEncryptionSecret }}
{{- $specs = append $specs (dict "name" "optscale-encryption" "data" (dict "encryption-key" $fernet "encryption-salt" (dict "generate" "alnum" "length" 32) "encryption-salt-auth" (dict "generate" "alnum" "length" 32) "bi-encryption-key" $fernet)) }}
{{- end }}
{{- $names := list }}
{{- range $specs }}{{- $names = append $names .name }}{{- end }}
{{- $hook := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: optscale-secrets-init
  labels:
    {{- include "optscale.labels" (dict "root" . "name" "secrets-init") | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
    helm.sh/hook-weight: "-10"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: optscale-secrets-init
  labels:
    {{- include "optscale.labels" (dict "root" . "name" "secrets-init") | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
    helm.sh/hook-weight: "-10"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  {{- if $names }}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{ toJson $names }}
    verbs: ["get", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: optscale-secrets-init
  labels:
    {{- include "optscale.labels" (dict "root" . "name" "secrets-init") | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
    helm.sh/hook-weight: "-10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: optscale-secrets-init
subjects:
  - kind: ServiceAccount
    name: optscale-secrets-init
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: optscale-secrets-spec
  labels:
    {{- include "optscale.labels" (dict "root" . "name" "secrets-init") | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
    helm.sh/hook-weight: "-10"
data:
  # What secrets-init generates when missing. Labels deliberately exclude
  # Helm/Argo tracking labels: generated Secrets are not release resources,
  # so uninstalling the chart never deletes credentials the data volumes
  # depend on.
  spec.json: |
    {{- dict "labels" (dict "app.kubernetes.io/part-of" "optscale" "app.kubernetes.io/created-by" "optscale-secrets-init") "secrets" $specs | toPrettyJson | nindent 4 }}
  ensure-secrets.py: |
    {{- .Files.Get "files/ensure-secrets.py" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: optscale-secrets-init
  labels:
    {{- include "optscale.labels" (dict "root" . "name" "secrets-init") | nindent 4 }}
  annotations:
    {{- toYaml $hook | nindent 4 }}
    helm.sh/hook-weight: "-5"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "optscale.selectorLabels" (dict "root" . "name" "secrets-init") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: optscale-secrets-init
      {{- include "optscale.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: secrets-init
          image: {{ include "optscale.image" (dict "root" . "repo" .Values.configurator.image "tag" .Values.configurator.imageTag) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python3", "/spec/ensure-secrets.py"]
          volumeMounts:
            - name: spec
              mountPath: /spec
              readOnly: true
          {{- with .Values.secretsInit.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: spec
          configMap:
            name: optscale-secrets-spec
      {{- include "optscale.podScheduling" (dict "root" .) | nindent 6 }}
{{- end }}
