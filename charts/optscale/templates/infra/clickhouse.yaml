{{- if not .Values.clickhouse.external.enabled }}
{{- $cfg := .Values.clickhouse }}
{{- if not $cfg.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-secret
  labels:
    {{- include "optscale.labels" (dict "root" . "name" $cfg.name) | nindent 4 }}
type: Opaque
data:
  password: {{ $cfg.password | b64enc | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $cfg.name }}
  labels:
    {{- include "optscale.labels" (dict "root" . "name" $cfg.name) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $cfg.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ $cfg.tcpPort }}
      targetPort: native
      protocol: TCP
      name: native
  selector:
    {{- include "optscale.selectorLabels" (dict "root" . "name" $cfg.name) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $cfg.name }}
  labels:
    {{- include "optscale.labels" (dict "root" . "name" $cfg.name) | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $cfg.name }}
  selector:
    matchLabels:
      {{- include "optscale.selectorLabels" (dict "root" . "name" $cfg.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "optscale.selectorLabels" (dict "root" . "name" $cfg.name) | nindent 8 }}
    spec:
      {{- include "optscale.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: {{ $cfg.name }}
          image: {{ $cfg.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_DB
              value: {{ $cfg.db | quote }}
            - name: CLICKHOUSE_USER
              value: {{ $cfg.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "optscale.clickhouse.secretName" . }}
                  key: password
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          livenessProbe:
            tcpSocket:
              port: native
            initialDelaySeconds: 30
            timeoutSeconds: 1
          readinessProbe:
            tcpSocket:
              port: native
            initialDelaySeconds: 5
            timeoutSeconds: 1
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
      {{- if not $cfg.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
      {{- include "optscale.podScheduling" (dict "root" . "comp" $cfg) | nindent 6 }}
  {{- if $cfg.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with ($cfg.persistence.storageClass | default .Values.global.storageClass) }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $cfg.persistence.size }}
  {{- end }}
{{- end }}
