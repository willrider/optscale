{{- if not .Values.mongo.external.enabled }}
{{- $cfg := .Values.mongo }}
{{- $image := include "optscale.image" (dict "root" . "repo" $cfg.image "tag" $cfg.imageTag) }}
{{- if not $cfg.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  labels:
    {{- include "optscale.labels" (dict "root" . "name" $cfg.name) | nindent 4 }}
type: Opaque
data:
  username: {{ $cfg.user | b64enc | quote }}
  password: {{ $cfg.password | b64enc | quote }}
  key.txt: {{ $cfg.key | b64enc | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-config
  labels:
    {{- include "optscale.labels" (dict "root" . "name" $cfg.name) | nindent 4 }}
data:
  mongod.conf: ""
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $cfg.name }}
  labels:
    {{- include "optscale.labels" (dict "root" . "name" $cfg.name) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $cfg.servicePort }}
      targetPort: mongodb
      protocol: TCP
      name: {{ $cfg.name }}
  selector:
    {{- include "optscale.selectorLabels" (dict "root" . "name" $cfg.name) | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-discovery
  labels:
    {{- include "optscale.labels" (dict "root" . "name" $cfg.name) | nindent 4 }}
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ $cfg.containerPort }}
      name: mongodb
  selector:
    {{- include "optscale.selectorLabels" (dict "root" . "name" $cfg.name) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $cfg.name }}
  labels:
    {{- include "optscale.labels" (dict "root" . "name" $cfg.name) | nindent 4 }}
spec:
  replicas: 1
  serviceName: mongo-discovery
  selector:
    matchLabels:
      {{- include "optscale.selectorLabels" (dict "root" . "name" $cfg.name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "optscale.selectorLabels" (dict "root" . "name" $cfg.name) | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      {{- include "optscale.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: copy-config
          image: {{ .Values.waitImage | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - "sh"
            - "-c"
            - |
              set -e
              cp /configdb-readonly/mongod.conf /data/configdb/mongod.conf
              cp /keydir-readonly/key.txt /data/configdb/key.txt
              chmod 600 /data/configdb/key.txt
          volumeMounts:
            - name: config
              mountPath: /configdb-readonly
            - name: configdir
              mountPath: /data/configdb
            - name: keydir
              mountPath: /keydir-readonly
        - name: bootstrap
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - peer-finder
          args:
            - -on-start=/on-start.sh
            - -service=mongo-discovery
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: REPLICA_SET
              value: {{ $cfg.name }}
            - name: TIMEOUT
              value: "900"
            - name: SKIP_INIT
              value: "false"
            - name: TLS_MODE
              value: requireSSL
            - name: AUTH
              value: "true"
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "optscale.mongo.secretName" . }}
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "optscale.mongo.secretName" . }}
                  key: password
          volumeMounts:
            - name: configdir
              mountPath: /data/configdb
            - name: data
              mountPath: /data/db
            - name: workdir
              mountPath: /work-dir
      containers:
        - name: {{ $cfg.name }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - mongod
            - --config=/data/configdb/mongod.conf
            - --dbpath=/data/db
            - --replSet={{ $cfg.name }}
            - --port={{ $cfg.containerPort }}
            - --bind_ip=0.0.0.0
            - --auth
            - --keyFile=/data/configdb/key.txt
            - --storageEngine=wiredTiger
            - --wiredTigerCacheSizeGB={{ $cfg.cacheSizeGb }}
          ports:
            - name: mongodb
              containerPort: {{ $cfg.containerPort }}
          livenessProbe:
            exec:
              command:
                - mongo
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - mongo
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            periodSeconds: 10
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: configdir
              mountPath: /data/configdb
            - name: workdir
              mountPath: /work-dir
      volumes:
        - name: config
          configMap:
            name: mongo-config
        - name: keydir
          secret:
            secretName: {{ include "optscale.mongo.secretName" . }}
            defaultMode: 0400
        - name: configdir
          emptyDir: {}
        - name: workdir
          emptyDir: {}
        {{- if not $cfg.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- include "optscale.podScheduling" (dict "root" . "comp" $cfg) | nindent 6 }}
  {{- if $cfg.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with ($cfg.persistence.storageClass | default .Values.global.storageClass) }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $cfg.persistence.size }}
  {{- end }}
{{- end }}
